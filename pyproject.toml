[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookstore-bi"
version = "0.1.0"
description = "Bookstore analytics API and Streamlit BI dashboard"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "google-genai",
    "networkx",
    "pandas",
    "pyarrow",
    "pydantic",
    "python-dotenv",
    "pyyaml",
    "streamlit>=1.57",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["httpx", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bookstore_bi = ["assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
